<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masa Seçimi | Ramiz Köfte Batman</title>
<link rel="shortcut icon" href="favicon-source.png">
<script>
  (function() {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else if (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #ffffff; --bg-alt: #f9f9f9; --text: #1a1a1a; --text-muted: #777777;
    --border: #eaeaea; --border-input: #ddd; --btn-bg: #1a1a1a; --btn-text: #ffffff;
    --btn-hover: #333; --nav-bg: #ffffff; --success: #2a5040; --success-bg: rgba(42,80,64,0.08);
    --warning: #b8860b; --transition: 0.3s ease;
  }
  [data-theme="dark"] {
    --bg: #0f0f0f; --bg-alt: #1a1a1a; --text: #f5f5f5; --text-muted: #999999;
    --border: #2a2a2a; --border-input: #333; --btn-bg: #f5f5f5; --btn-text: #0f0f0f;
    --btn-hover: #d4d4d4; --nav-bg: #0f0f0f; --success: #7aa589; --success-bg: rgba(122,165,137,0.1);
    --warning: #d4a017;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--text); background: var(--bg); min-height: 100vh; display: flex; flex-direction: column;
  }

  /* NAVBAR */
  .navbar { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: var(--nav-bg); display: flex; align-items: center; justify-content: center; z-index: 9999; border-bottom: 1px solid var(--border); }
  .nav-inner { display: flex; align-items: center; gap: 20px; max-width: 1400px; width: 100%; padding: 0 24px; justify-content: space-between; }
  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo-img { width: 48px; height: 48px; object-fit: contain; }
  .nav-logo-main { font-size: 22px; font-weight: 700; font-family: Georgia, serif; color: var(--text); letter-spacing: -0.02em; }
  
  .theme-toggle { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-input); background: transparent; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; overflow: hidden; }
  .theme-toggle .icon { position: absolute; transition: transform 0.5s, opacity 0.4s; }
  .theme-toggle .icon-sun { opacity: 0; transform: rotate(0deg) scale(1); }
  .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
  [data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(180deg) scale(1); }
  [data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(-180deg) scale(0); }

  /* MASA SEÇİM EKRANI */
  .masa-secim-screen { display: flex; flex-direction: column; align-items: center; padding: 100px 20px 40px; flex: 1; }
  .masa-title { font-size: 28px; font-weight: 700; font-family: Georgia, serif; margin-bottom: 8px; text-align: center; }
  .masa-desc { font-size: 15px; color: var(--text-muted); margin-bottom: 30px; text-align: center; }
  
  /* KROKİ PLANI */
  .kroki-container {
    width: 100%; max-width: 850px; background: var(--bg-alt);
    border: 2px dashed var(--border); border-radius: 12px;
    position: relative;
    aspect-ratio: 16/10;
    margin: 0 auto;
  }
  
  /* MASA BUTONLARI */
  .masa-btn {
    position: absolute;
    width: 60px; height: 60px; border-radius: 12px;
    background: var(--bg); border: 2px solid var(--border-input);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: var(--text);
    cursor: pointer; transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transform: translate(-50%, -50%);
  }
  .masa-btn:hover { border-color: var(--text); transform: translate(-50%, -50%) scale(1.05); }
  .masa-btn.selected { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }

  /* --- YERLEŞİMLER --- */

  /* Sol Kolon */
  .masa-11 { top: 30%; left: 15%; }
  .masa-12 { top: 70%; left: 15%; }

  /* Sağ Kolon (Orijinal Yerleri) */
  .masa-2 { top: 30%; right: 15%; }
  .masa-1 { top: 70%; right: 15%; }

  /* Orta Üst Sıra (6,5,4,3) - Tam Ortada */
  .masa-6 { top: 35%; left: 37%; }
  .masa-5 { top: 35%; left: 45.5%; }
  .masa-4 { top: 35%; left: 54.5%; }
  .masa-3 { top: 35%; left: 63%; }

  /* Orta Alt Sıra (10,9,8,7) - Tam Ortada */
  .masa-10 { top: 65%; left: 37%; }
  .masa-9  { top: 65%; left: 45.5%; }
  .masa-8  { top: 65%; left: 54.5%; }
  .masa-7  { top: 65%; left: 63%; }

  /* Kapı (11 ve 12 ortasında, dışa doğru) */
  .kapi-box { 
    position: absolute;
    width: 70px; height: 32px; background: var(--bg); border: 2px solid var(--border); 
    display: flex; align-items: center; justify-content: center; 
    border-radius: 8px; color: var(--text-muted); font-weight: 700; font-size: 11px;
    top: 50%; left: 2%; transform: translateY(-50%) rotate(90deg);
    letter-spacing: 2px;
  }
  
  /* Kasa (12'nin Sağ Alt Çaprazı) */
  .kasa-box { 
    position: absolute;
    width: 65px; height: 65px; background: var(--bg); border: 2px dashed var(--warning); 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    border-radius: 12px; color: var(--warning); font-weight: 700; font-size: 13px;
    top: 82%; left: 24%; transform: rotate(-10deg);
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }

  .secim-devam-btn {
    margin-top: 30px; padding: 16px 40px; border-radius: 100px;
    background: var(--btn-bg); color: var(--btn-text);
    font-size: 16px; font-weight: 700; border: none; cursor: pointer;
    opacity: 0.3; pointer-events: none; transition: all 0.3s;
  }
  .secim-devam-btn.active { opacity: 1; pointer-events: auto; }
  .secim-devam-btn.active:hover { background: var(--btn-hover); transform: translateY(-2px); }

  /* Mobil Uyum */
  @media (max-width: 768px) {
    .kroki-container { aspect-ratio: 1/1; }
    .masa-btn { width: 45px; height: 45px; font-size: 14px; }
    
    .masa-11 { top: 20%; left: 15%; }
    .masa-12 { top: 80%; left: 15%; }
    .masa-2 { top: 20%; right: 15%; }
    .masa-1 { top: 80%; right: 15%; }
    
    /* Mobilde ortalama */
    .masa-6 { top: 35%; left: 34%; }
    .masa-5 { top: 35%; left: 44.6%; }
    .masa-4 { top: 35%; left: 55.3%; }
    .masa-3 { top: 35%; left: 66%; }

    .masa-10 { top: 65%; left: 34%; }
    .masa-9  { top: 65%; left: 44.6%; }
    .masa-8  { top: 65%; left: 55.3%; }
    .masa-7  { top: 65%; left: 66%; }

    .kapi-box { left: 0%; transform: translateY(-50%) rotate(90deg); width: 50px; height: 25px; font-size: 9px; }
    .kasa-box { top: 90%; left: 28%; width: 50px; height: 50px; font-size: 11px; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="favicon-source.png" alt="Ramiz Köfte" class="nav-logo-img">
        <span class="nav-logo-main">Ramiz Köfte</span>
      </a>
      <div class="nav-icons">
        <button class="theme-toggle" id="themeToggle"><span class="icon icon-sun">☀️</span><span class="icon icon-moon">🌙</span></button>
      </div>
    </div>
  </nav>

  <!-- MASA SEÇİM EKRANI -->
  <div class="masa-secim-screen">
    <h1 class="masa-title">Hoş Geldiniz</h1>
    <p class="masa-desc">Lütfen oturduğunuz masayı seçin</p>
    
    <div class="kroki-container">
      
      <div class="kapi-box">GİRİŞ</div>
      <div class="kasa-box">KASA</div>

      <!-- Sol Masalar -->
      <button class="masa-btn masa-11" data-masa="11">11</button>
      <button class="masa-btn masa-12" data-masa="12">12</button>

      <!-- Orta Üst (6,5,4,3) -->
      <button class="masa-btn masa-6" data-masa="6">6</button>
      <button class="masa-btn masa-5" data-masa="5">5</button>
      <button class="masa-btn masa-4" data-masa="4">4</button>
      <button class="masa-btn masa-3" data-masa="3">3</button>

      <!-- Orta Alt (10,9,8,7) -->
      <button class="masa-btn masa-10" data-masa="10">10</button>
      <button class="masa-btn masa-9" data-masa="9">9</button>
      <button class="masa-btn masa-8" data-masa="8">8</button>
      <button class="masa-btn masa-7" data-masa="7">7</button>

      <!-- Sağ Masalar -->
      <button class="masa-btn masa-2" data-masa="2">2</button>
      <button class="masa-btn masa-1" data-masa="1">1</button>

    </div>

    <button class="secim-devam-btn" id="masaConfirmBtn">Devam Et →</button>
  </div>

  <script>
    // Tema
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', function () {
      const current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark') { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
    });

    // Masa Seçimi
    const masaBtns = document.querySelectorAll('.masa-btn');
    const masaConfirmBtn = document.getElementById('masaConfirmBtn');
    let selectedMasa = null;

    masaBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        masaBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedMasa = btn.getAttribute('data-masa');
        masaConfirmBtn.classList.add('active');
      });
    });

    masaConfirmBtn.addEventListener('click', () => {
      if (!selectedMasa) return;
      localStorage.setItem('ramiz_masa', selectedMasa);
      alert("Masa " + selectedMasa + " seçildi. Menüye geçiliyor...");
    });
  </script>
</body>
</html>
