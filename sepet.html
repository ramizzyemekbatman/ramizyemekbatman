<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sepetim | Ramiz Köfte Batman</title>
<link rel="shortcut icon" href="favicon-source.png">
<script>
  (function() {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else if (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #ffffff; --bg-alt: #f5f5f5; --text: #1a1a1a; --text-muted: #666666;
    --border: #f0f0f0; --border-input: #ddd; --btn-bg: #1a1a1a; --btn-text: #ffffff;
    --btn-hover: #333; --nav-bg: #ffffff; --success: #2a5040; --success-bg: rgba(42,80,64,0.08);
    --danger: #c0392b; --danger-bg: rgba(192,57,43,0.08); --transition: 0.4s ease;
  }
  [data-theme="dark"] {
    --bg: #0f0f0f; --bg-alt: #1a1a1a; --text: #f5f5f5; --text-muted: #aaaaaa;
    --border: #2a2a2a; --border-input: #333; --btn-bg: #f5f5f5; --btn-text: #0f0f0f;
    --btn-hover: #d4d4d4; --nav-bg: #0f0f0f; --success: #7aa589; --success-bg: rgba(122,165,137,0.1);
    --danger: #e74c3c; --danger-bg: rgba(231,76,60,0.1);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
  .navbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--nav-bg); display: flex; align-items: center; justify-content: center; z-index: 9999; border-bottom: 1px solid var(--border); }
  .nav-inner { display: flex; align-items: center; gap: 20px; max-width: 1400px; width: 100%; padding: 0 20px; justify-content: space-between; }
  .nav-logo { display: flex; flex-direction: row; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo-img { width: 44px; height: 44px; object-fit: contain; }
  .nav-logo-main { font-size: 20px; font-weight: 700; font-family: Georgia, serif; color: var(--text); }
  .theme-toggle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-input); background: transparent; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; position: relative; overflow: hidden; }
  .theme-toggle .icon { position: absolute; transition: transform 0.5s, opacity 0.4s; }
  .theme-toggle .icon-sun { opacity: 0; transform: rotate(0deg) scale(1); }
  .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
  [data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(180deg) scale(1); }
  [data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(-180deg) scale(0); }

  .cart-wrap { flex: 1; max-width: 800px; margin: 0 auto; padding: 80px 20px 40px; width: 100%; }
  .page-title { font-size: 28px; font-weight: 600; font-style: italic; font-family: Georgia, serif; margin-bottom: 20px; }
  .cart-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .cart-item { display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 12px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; }
  .cart-thumb { width: 60px; height: 60px; border-radius: 8px; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; }
  .cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cart-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-price-unit { font-size: 12px; color: var(--text-muted); }
  .cart-controls { display: flex; align-items: center; gap: 8px; }
  .qty-control { display: inline-flex; align-items: center; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 100px; }
  .qty-btn { width: 30px; height: 30px; border: none; background: transparent; color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; }
  .qty-num { min-width: 24px; text-align: center; font-size: 13px; font-weight: 700; }
  .remove-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-input); background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; }
  .remove-btn:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }

  .cart-summary { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; color: var(--text-muted); }
  .summary-row.discount { color: var(--success); font-weight: 700; }
  .summary-row.total { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 16px; font-size: 18px; font-weight: 700; color: var(--text); }
  .summary-row.total .val { font-size: 22px; }
  
  .masa-box { background: var(--success-bg); border: 1px solid var(--success); padding: 16px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
  .masa-label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--success); margin-bottom: 4px; }
  .masa-value { font-size: 24px; font-weight: 800; color: var(--success); }
  .masa-error { background: var(--danger-bg); border-color: var(--danger); }
  .masa-error .masa-label, .masa-error .masa-value { color: var(--danger); }

  .checkout-btn { width: 100%; margin-top: 16px; padding: 16px; background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  .checkout-btn:hover { background: var(--btn-hover); }
  .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .cart-empty { text-align: center; padding: 60px 20px; }
  .cart-empty-icon { font-size: 64px; opacity: 0.3; margin-bottom: 16px; display: block; }
  .cart-empty-title { font-size: 20px; font-weight: 400; font-style: italic; margin-bottom: 6px; }
  .continue-btn { display: inline-flex; padding: 12px 24px; background: var(--btn-bg); color: var(--btn-text); border-radius: 100px; font-size: 13px; font-weight: 600; text-decoration: none; margin-top: 16px; }
  
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120%); padding: 12px 24px; background: var(--btn-bg); color: var(--btn-text); border-radius: 100px; font-size: 13px; font-weight: 500; z-index: 100000; transition: transform 0.4s; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); color: #fff; }
  .toast.danger { background: var(--danger); color: #fff; }

  footer { background: #000; color: #fff; padding: 40px 20px 20px; margin-top: auto; }
  .footer-container { max-width: 800px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  .footer-col h4 { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; color: #fff; }
  .footer-col a { font-size: 13px; color: #fff; opacity: 0.7; text-decoration: none; display: block; margin-bottom: 8px; }
  .footer-copyright { text-align: center; padding-top: 20px; font-size: 12px; color: #666; }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="favicon-source.png" alt="Ramiz Köfte" class="nav-logo-img">
        <span class="nav-logo-main">Ramiz Köfte</span>
      </a>
      <div class="nav-icons">
        <button class="theme-toggle" id="themeToggle"><span class="icon icon-sun">☀️</span><span class="icon icon-moon">🌙</span></button>
      </div>
    </div>
  </nav>

  <div class="cart-wrap">
    <h1 class="page-title">Sepetim</h1>
    <div class="cart-list" id="cartList"></div>
    
    <div id="checkoutArea" style="display:none;">
      <div class="masa-box" id="masaBox">
        <div class="masa-label">Masa Numaranız</div>
        <div class="masa-value" id="masaValue">-</div>
      </div>

      <div class="cart-summary">
        <div class="summary-row"><span>Ara Toplam</span><span id="subTotal">0,00 ₺</span></div>
        
        <!-- KAMPANYA İNDİRİM SATIRI -->
        <div class="summary-row discount" id="discountRow" style="display:none;">
          <span>Kampanya İndirimi (%10)</span>
          <span id="discountVal">-0,00 ₺</span>
        </div>

        <div class="summary-row total"><span>TOPLAM</span><span class="val" id="grandTotal">0,00 ₺</span></div>
        <button class="checkout-btn" id="checkoutBtn">✅ Siparişi Onayla</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-container">
      <div class="footer-col">
        <h4>İletişim</h4>
        <p>Gültepe Mah. Demokrasi Bul. Petrol City 2. Kat</p>
        <a href="tel:+905015715272">📞 0501 571 52 72</a>
      </div>
      <div class="footer-col">
        <h4>Kurumsal</h4>
        <a href="hakkimizda.html">Hakkımızda</a>
        <a href="kkkk.html">KVKK Aydınlatma Metni</a>
        <a href="cerez.html">Çerez Politikası</a>
      </div>
    </div>
    <div class="footer-copyright">© 2026 Ramiz Köfte · Tüm hakları saklıdır.</div>
  </footer>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { addOrder } from './firebase-config.js';

    const CATEGORIES = { kofte:{emoji:'🍖'}, tavuk:{emoji:'🍗'}, sucuk:{emoji:'🌭'}, ekmek:{emoji:'🥙'}, yan:{emoji:'🍟'}, icecek:{emoji:'🥤'} };

    function getCart() { try { return JSON.parse(localStorage.getItem('ramiz_cart')) || []; } catch (e) { return []; } }
    function saveCart(cart) { localStorage.setItem('ramiz_cart', JSON.stringify(cart)); }
    function fmt(n) { return Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺'; }
    function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    // KAMPANYA HESAPLAMA FONKSİYONU
    function calculateDiscount(total) {
      if (total >= 370) {
        return Math.floor((total / 100) * 10);
      }
      return 0;
    }

    let toastTimer = null;
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast' + (type ? ' ' + type : ''); }, 2200);
    }

    function renderCart() {
      const cart = getCart();
      const listEl = document.getElementById('cartList');
      const checkoutArea = document.getElementById('checkoutArea');

      if (cart.length === 0) {
        listEl.innerHTML = `<div class="cart-empty"><span class="cart-empty-icon">🛒</span><div class="cart-empty-title">Sepetiniz boş</div><a href="index.html" class="continue-btn">← Menüye Dön</a></div>`;
        checkoutArea.style.display = 'none';
        return;
      }

      listEl.innerHTML = cart.map(item => {
        const cat = CATEGORIES[item.category] || { emoji: '❓' };
        const thumb = item.photo ? `<img src="${escapeHtml(item.photo)}" onerror="this.style.display='none';this.parentNode.textContent='${cat.emoji}';">` : cat.emoji;
        return `
          <div class="cart-item" data-id="${item.id}">
            <div class="cart-thumb">${thumb}</div>
            <div><div class="cart-name">${escapeHtml(item.name)}</div><div class="cart-price-unit">${fmt(item.price)} / adet</div></div>
            <div class="cart-controls">
              <div class="qty-control"><button class="qty-btn" data-action="dec" data-id="${item.id}">−</button><span class="qty-num">${item.qty || 1}</span><button class="qty-btn" data-action="inc" data-id="${item.id}">+</button></div>
              <button class="remove-btn" data-action="remove" data-id="${item.id}">🗑️</button>
            </div>
          </div>`;
      }).join('');

      const subTotal = cart.reduce((s, i) => s + Number(i.price) * (i.qty || 1), 0);
      const discountAmount = calculateDiscount(subTotal);
      const grandTotal = subTotal - discountAmount;

      document.getElementById('subTotal').textContent = fmt(subTotal);
      
      const discountRow = document.getElementById('discountRow');
      if (discountAmount > 0) {
        discountRow.style.display = 'flex';
        document.getElementById('discountVal').textContent = '-' + fmt(discountAmount);
      } else {
        discountRow.style.display = 'none';
      }

      document.getElementById('grandTotal').textContent = fmt(grandTotal);

      checkoutArea.style.display = 'block';
      checkMasa();
    }

    function checkMasa() {
      const masa = localStorage.getItem('ramiz_masa');
      const box = document.getElementById('masaBox');
      const val = document.getElementById('masaValue');
      const btn = document.getElementById('checkoutBtn');

      if (masa) {
        box.classList.remove('masa-error');
        val.textContent = 'Masa ' + masa;
        btn.disabled = false;
        btn.textContent = '✅ Siparişi Onayla';
      } else {
        box.classList.add('masa-error');
        val.textContent = 'Okutulmadı!';
        btn.disabled = true;
        btn.textContent = '⚠️ Lütfen Masadaki QR Kodu Okutun';
      }
    }

    document.getElementById('cartList').addEventListener('click', function (e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');
      const id = btn.getAttribute('data-id');
      const cart = getCart();
      const item = cart.find(c => c.id === id);
      if (!item) return;

      if (action === 'inc') item.qty = (item.qty || 1) + 1;
      else if (action === 'dec') {
        item.qty = (item.qty || 1) - 1;
        if (item.qty <= 0) { cart.splice(cart.findIndex(c => c.id === id), 1); }
      } else if (action === 'remove') {
        cart.splice(cart.findIndex(c => c.id === id), 1);
      }
      saveCart(cart);
      renderCart();
    });

    document.getElementById('checkoutBtn').addEventListener('click', async function () {
      const cart = getCart();
      if (cart.length === 0) return;

      const masa = localStorage.getItem('ramiz_masa');
      if (!masa) {
        showToast('⚠️ Lütfen masadaki QR kodu okutun', 'danger');
        return;
      }

      this.disabled = true;
      this.textContent = '⏳ Gönderiliyor...';

      const subTotal = cart.reduce((s, i) => s + Number(i.price) * (i.qty || 1), 0);
      const discountAmount = calculateDiscount(subTotal);
      const finalTotal = subTotal - discountAmount;

      const newOrder = {
        masaNo: masa,
        items: cart.map(i => ({
          id: i.id, name: i.name, price: i.price, photo: i.photo || '', category: i.category, qty: i.qty || 1
        })),
        total: subTotal, 
        discountPercent: discountAmount > 0 ? 10 : 0, 
        discountAmount: discountAmount, 
        discountedTotal: finalTotal,
        status: 'pending', 
        lastUpdated: Date.now()
      };

      try {
        const docId = await addOrder(newOrder);
        if (!docId) throw new Error('Sipariş kaydedilemedi');

        localStorage.removeItem('ramiz_cart');
        // Başarılı olursa Hakkımızda sayfasına yönlendir
        window.location.href = 'hakkimizda.html?siparis=basarili';

      } catch (err) {
        showToast('❌ Gönderilemedi, tekrar deneyin.', 'danger');
        this.disabled = false;
        this.textContent = '✅ Siparişi Onayla';
      }
    });

    (function () {
      const themeToggle = document.getElementById('themeToggle');
      themeToggle.addEventListener('click', function () {
        const current = document.documentElement.getAttribute('data-theme');
        if (current === 'dark') { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
        else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
      });
    })();

    renderCart();
  </script>
</body>
</html>
